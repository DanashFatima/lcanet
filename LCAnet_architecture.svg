<svg width="680" height="340" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>LCAnet ontology network architecture</title>
  <desc>Hub-and-spoke diagram showing five domain modules (Activity, Actor, Property, Spatiotemporal, Impact Assessment) connected by directed arrows to a central Core module, which serves as the semantic integration layer.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- White background (for paper embedding) -->
  <rect width="680" height="340" fill="white"/>

  <!-- ── Domain modules (top row) ── -->

  <!-- Activity module — green -->
  <g id="mod-activity">
    <rect x="20" y="28" width="108" height="52" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#27500A" x="74" y="52" text-anchor="middle" dominant-baseline="central">Activity</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#3B6D11" x="74" y="68" text-anchor="middle" dominant-baseline="central">module</text>
  </g>

  <!-- Actor module — blue -->
  <g id="mod-actor">
    <rect x="148" y="28" width="108" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#0C447C" x="202" y="52" text-anchor="middle" dominant-baseline="central">Actor</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#185FA5" x="202" y="68" text-anchor="middle" dominant-baseline="central">module</text>
  </g>

  <!-- Property module — orange/amber -->
  <g id="mod-property">
    <rect x="276" y="28" width="128" height="52" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#633806" x="340" y="52" text-anchor="middle" dominant-baseline="central">Property</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#854F0B" x="340" y="68" text-anchor="middle" dominant-baseline="central">module</text>
  </g>

  <!-- Spatiotemporal module — warm yellow -->
  <g id="mod-spatiotemporal">
    <rect x="424" y="28" width="128" height="52" rx="8" fill="#FFFBEB" stroke="#92610A" stroke-width="1"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#633806" x="488" y="48" text-anchor="middle" dominant-baseline="central">Spatiotemporal</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#92610A" x="488" y="66" text-anchor="middle" dominant-baseline="central">module</text>
  </g>

  <!-- Impact Assessment module — red -->
  <g id="mod-impact-assessment">
    <rect x="572" y="28" width="88" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="1"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#791F1F" x="616" y="44" text-anchor="middle" dominant-baseline="central">Impact</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" fill="#791F1F" x="616" y="58" text-anchor="middle" dominant-baseline="central">Assessment</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#A32D2D" x="616" y="72" text-anchor="middle" dominant-baseline="central">module</text>
  </g>

  <!-- ── Core module (centre, dominant) ── -->
  <g id="mod-core">
    <rect x="215" y="200" width="250" height="100" rx="10" fill="#F4F3F1" stroke="#5F5E5A" stroke-width="1.5"/>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="500" fill="#2C2C2A" x="340" y="232" text-anchor="middle" dominant-baseline="central">Core module</text>
    <text font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" x="340" y="256" text-anchor="middle" dominant-baseline="central">Semantic integration layer</text>
  </g>

  <!-- ── Directed arrows: domain modules → Core module ── -->

  <!-- Activity → Core -->
  <path d="M74 80 C74 155, 250 200, 267 200" fill="none" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- Actor → Core -->
  <path d="M202 80 C202 160, 278 200, 285 200" fill="none" stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- Property → Core (vertical) -->
  <path d="M340 80 L340 200" fill="none" stroke="#854F0B" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- Spatiotemporal → Core -->
  <path d="M488 80 C488 160, 402 200, 395 200" fill="none" stroke="#92610A" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- Impact Assessment → Core -->
  <path d="M616 80 C616 155, 430 200, 413 200" fill="none" stroke="#A32D2D" stroke-width="1.2" marker-end="url(#arrow)" opacity="0.75"/>

</svg>
